name: Migrazione Archivio Fladynance

# Questo workflow si lancia UNA VOLTA SOLA a mano.
# Importa le notizie storiche di Fladynance nell'archivio di Thesyum.
# Dopo averlo lanciato, la sezione "Cerca per tema" nell'area riservata
# sara' gia' piena di notizie storiche dal giorno 1.
#
# PRIMA DI LANCIARLO:
# 1. Carica migra_archivio.py nella root di questa repo
# 2. Crea la cartella import/ e mettici dentro macro_db.json di Fladynance
#    (vai in fladynance/fladynance -> state/macro_db.json -> Raw -> scarica)

on:
  workflow_dispatch:   # si lancia solo a mano, mai in automatico

permissions:
  contents: write

jobs:
  migra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifica file necessari
        run: |
          echo "=== Verifica file ==="
          if [ ! -f "migra_archivio.py" ]; then
            echo "ERRORE: migra_archivio.py non trovato nella root"
            exit 1
          fi
          if [ ! -f "import/macro_db.json" ]; then
            echo "ERRORE: import/macro_db.json non trovato"
            echo "Crea la cartella import/ e mettici dentro macro_db.json di Fladynance"
            exit 1
          fi
          echo "OK: tutti i file presenti"
          echo "Notizie in macro_db.json: $(python3 -c "import json; d=json.load(open('import/macro_db.json')); print(len(d))")"

      - name: Lancia migrazione (dry-run prima)
        run: |
          echo "=== DRY-RUN: cosa verrebbe importato ==="
          python migra_archivio.py --dry-run

      - name: Lancia migrazione reale
        run: |
          echo "=== MIGRAZIONE REALE ==="
          python migra_archivio.py

      - name: Copia archivio in docs/ per l'area web
        run: |
          mkdir -p docs
          if [ -f "state/news_archive.json" ]; then
            cp state/news_archive.json docs/news_archive.json
            echo "news_archive.json copiato in docs/"
          fi

      - name: Pubblica archivio su thesyum.com/area
        env:
          THESYUM_PUSH_TOKEN: ${{ secrets.THESYUM_PUSH_TOKEN }}
        run: |
          git clone https://x-access-token:${THESYUM_PUSH_TOKEN}@github.com/fladynance/Thesyum.git /tmp/thesyum_repo
          cd /tmp/thesyum_repo
          mkdir -p area
          if [ -f "$GITHUB_WORKSPACE/docs/news_archive.json" ]; then
            cp "$GITHUB_WORKSPACE/docs/news_archive.json" area/news_archive.json
            echo "Archivio copiato nella repo Thesyum"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add area/
          if git diff --cached --quiet; then
            echo "Nessuna novita' da pubblicare."
            exit 0
          fi
          git commit -m "area: importa archivio storico da Fladynance $(date -u '+%Y-%m-%d')"
          git push
          echo "Archivio storico pubblicato su thesyum.com/area"

      - name: Committa lo stato aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ docs/ || true
          if git diff --cached --quiet; then
            echo "Nessun cambiamento da committare."
            exit 0
          fi
          git commit -m "migrazione: archivio storico Fladynance $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main && git push
          echo "Stato committato"
